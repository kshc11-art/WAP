name: 버그
description: 스크립트가 동작하지 않거나 사내 페이지에 문제를 일으킴
labels: ["bug"]
body:
  - type: input
    id: script
    attributes:
      label: 대상 스크립트 / 버전
      placeholder: "[IPMS] 검색 개선 1.4.2"
    validations:
      required: true
  - type: textarea
    id: symptom
    attributes:
      label: 증상
      description: 무슨 일이 일어나는가. 콘솔 오류가 있으면 함께 (개인정보는 지우고)
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 재현 방법
      placeholder: |
        1. 포털 로그인
        2. IPMS 업무요청 탭 진입
        3. 검색 버튼 클릭
        → 목록이 비어서 표시됨
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: 업무 영향
      options:
        - 사내 페이지가 깨져서 업무가 막힘 (긴급)
        - 내 기능만 동작 안 함 (업무는 가능)
        - 표시가 이상하지만 사용에 지장 없음
    validations:
      required: true
  - type: checkboxes
    id: workaround
    attributes:
      label: 임시 조치
      options:
        - label: 해당 스크립트를 껐더니 사내 페이지는 정상으로 돌아왔다
