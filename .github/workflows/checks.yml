name: structure-and-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-dev.txt
      - name: Repository, source syntax and secret checks
        run: python tools/check.py
      - name: Comparison engine regression
        run: python -m unittest discover -s tests -v
      - name: Browser workflow, IP ledger and input helper regressions
        run: node --test tests/test_dashboard.cjs tests/test_stats_ledger.cjs tests/test_input_helper.cjs
      - name: Private repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api repos/${{ github.repository }} --jq .visibility)" = private
      - name: Business validation status
        run: echo 'Raw/golden not provided. Business accuracy is NOT certified by this workflow.'
