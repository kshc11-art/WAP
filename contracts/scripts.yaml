# contracts/scripts.yaml — 스크립트 정체성 원장
#
# 이 저장소에서 사람이 손으로 유지하는 거의 유일한 파일이다. 나머지 색인·리포트는
# 전부 이 파일에서 생성된다.
#
# slug 는 영구 식별자다. 파일명·표시명은 바뀌어도 slug 는 바뀌지 않는다.
#   - 파일명을 바꾸고 싶다  → 아무 이름으로 inbox 에 넣으면 된다. 경로는 slug 가 정한다.
#   - 표시명을 바꾸고 싶다  → displayName 한 줄을 고친다.
#     (주의: Tampermonkey 쪽 이름은 그 스크립트를 다시 붙여넣어야 바뀐다.
#      저장소가 줄여주는 것은 이력 추적이지 붙여넣기 횟수가 아니다.)
#
# namespace.current 는 실측값이고 namespace.target 은 정규화 후 값이다.
# 아래 실측에서 namespace 가 겹치는 그룹이 넷 있다 — Tampermonkey 는
# (@namespace, @name) 쌍으로 스크립트를 식별하므로 이 중복은 반입 전에 풀어야 한다.
#   https://krisstar.kriss.re.kr/  4개 · kriss-ipms-enhancement 3개
#   kriss.internal.console 3개     · kriss.krisstar.tools 2개
#
# ※ 내부 호스트명이 namespace 실측값에 포함된다. 저장소 반출 정책이 확정되기 전에는
#   이 파일이 경고 대상이다(tools/guard.py 가 WARN 으로 표시).
#
# status: imported = 저장소에 파일이 있음 / pending = 아직 반입 전

